name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user-service, order-service, notification-service]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Lint with flake8
        working-directory: services/${{ matrix.service }}
        run: flake8 main.py --max-line-length=120 --extend-ignore=E501

      - name: Syntax check
        working-directory: services/${{ matrix.service }}
        run: python -m py_compile main.py

  build-images:
    runs-on: ubuntu-latest
    needs: lint-and-test
    strategy:
      matrix:
        include:
          - service: user-service
            context: services/user-service
          - service: order-service
            context: services/order-service
          - service: notification-service
            context: services/notification-service
          - service: api-gateway
            context: services/api-gateway
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          tags: microservices-demo/${{ matrix.service }}:ci

  compose-smoke:
    runs-on: ubuntu-latest
    needs: build-images
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: docker compose up -d --build --wait

      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health; then break; fi
            sleep 2
          done
          curl -sf http://localhost:8080/health

      - name: Smoke test API flow
        run: |
          USER=$(curl -sf -X POST http://localhost:8080/api/users \
            -H "Content-Type: application/json" \
            -d '{"email":"ci@example.com","name":"CI User"}')
          echo "$USER"
          USER_ID=$(echo "$USER" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          ORDER=$(curl -sf -X POST http://localhost:8080/api/orders \
            -H "Content-Type: application/json" \
            -d "{\"user_id\":$USER_ID,\"product\":\"Widget\",\"quantity\":2}")
          echo "$ORDER"
          curl -sf http://localhost:8080/api/notifications

      - name: Tear down
        if: always()
        run: docker compose down -v
