apiVersion: v1
kind: ConfigMap
metadata:
  name: microservices-config
  labels:
    app: microservices-demo
data:
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/microservices
  REDIS_URL: redis://redis:6379/0
  USER_SERVICE_URL: http://user-service:5001
  NOTIFICATION_CHANNEL: notifications
  CACHE_TTL: "60"
  MAX_NOTIFICATIONS: "100"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-nginx
  labels:
    app: api-gateway
data:
  default.conf: |
    upstream user_service {
        server user-service:5001;
    }
    upstream order_service {
        server order-service:5002;
    }
    upstream notification_service {
        server notification-service:5003;
    }
    server {
        listen 80;
        location /health {
            default_type application/json;
            return 200 '{"service":"api-gateway","status":"ok"}';
        }
        location /api/users {
            rewrite ^/api/users(.*)$ /users$1 break;
            proxy_pass http://user_service;
        }
        location /api/orders {
            rewrite ^/api/orders(.*)$ /orders$1 break;
            proxy_pass http://order_service;
        }
        location /api/notifications {
            rewrite ^/api/notifications(.*)$ /notifications$1 break;
            proxy_pass http://notification_service;
        }
        location /users { proxy_pass http://user_service; }
        location /orders { proxy_pass http://order_service; }
        location /notifications { proxy_pass http://notification_service; }
    }
